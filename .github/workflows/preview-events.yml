name: Request preview rebuild
on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
permissions:
  actions: write
jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch trusted publication workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy.yml --ref "${{ github.event.repository.default_branch }}"
        # pull_request_target runs the workflow from the default branch.
        # No pull request code is checked out or executed here.
